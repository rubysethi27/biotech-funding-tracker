<style>

    --stage-b: #7a8fc9;
    --stage-c: #b06bc9;
    --type-tag-color: #d68a5c;

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }

    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .round-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .round-row:last-child { border-bottom: none; }
  .round-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .round-left { display: flex; gap: 12px; align-items: flex-start; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: #22262c;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--muted);
    flex-shrink: 0;
  }
  .company { font-weight: 600; font-size: 14px; }
  .subline { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stage-tag, .type-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 6px;
    font-weight: 600;
  }
  .stage-seed { background: rgba(107,143,113,0.2); color: var(--stage-seed); }
  .stage-a { background: rgba(201,162,75,0.2); color: var(--stage-a); }
  .stage-b { background: rgba(122,143,201,0.2); color: var(--stage-b); }
  .stage-c { background: rgba(176,107,201,0.2); color: var(--stage-c); }
  .stage-other { background: rgba(154,158,165,0.2); color: var(--muted); }
  .type-tag { background: rgba(214,138,92,0.18); color: var(--type-tag-color); }
  .round-right { text-align: right; }
  .amount { font-weight: 700; font-size: 14px; }
  .led-by { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .expand-hint { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .details {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: #101216;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
  }
  .details.open { display: block; }
  .details .row { margin-bottom: 6px; }
  .details .label {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
    margin-right: 6px;
  }
  .details .rationale {
    font-style: italic;
    color: #c9cdd3;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
  }
  .stat-row .bar-bg {
    flex: 1;
    height: 6px;
    background: #22262c;
    border-radius: 3px;
    margin: 0 10px;
    overflow: hidden;
    align-self: center;
  }
  .stat-row .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .footer-note {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    margin-top: 20px;
  }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }
</style>
</head>

function stageClass(stage) {
  if (!stage) return "stage-other";
  const s = stage.toLowerCase();
  if (s.includes("seed")) return "stage-seed";
  if (s.includes("a")) return "stage-a";
  if (s.includes("b")) return "stage-b";
  if (s.includes("c") || s.includes("d")) return "stage-c";
  return "stage-other";
}

function initials(name) {
  return (name || "?").split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
}

function formatAmount(m) {
  if (m == null) return "—";
  return m >= 1000 ? "$" + (m / 1000).toFixed(1) + "B" : "$" + m.toFixed(1) + "M";
}

function esc(s) {
  if (s == null) return "";
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

        ${r.target_indication ? `<div class="row"><span class="label">Indication</span>${esc(r.target_indication)}</div>` : ""}
        ${r.trial_phase ? `<div class="row"><span class="label">Stage of development</span>${esc(r.trial_phase)}</div>` : ""}
        ${r.lead_investor ? `<div class="row"><span class="label">Lead investor</span>${esc(r.lead_investor)}${r.lead_investor_type ? ' <span class="type-tag">' + esc(r.lead_investor_type) + '</span>' : ""}</div>` : ""}
        ${r.lead_investor_rationale ? `<div class="row rationale">"${esc(r.lead_investor_rationale)}"</div>` : ""}
        ${r.other_investors ? `<div class="row"><span class="label">Also participating</span>${esc(r.other_investors)}</div>` : ""}
        ${r.added_display ? `<div class="row"><span class="label">Added to tracker</span>${esc(r.added_display)}</div>` : ""}
      </div>
    </div>
  `).join("");
}

function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("open");
}

function renderStageBreakdown() {
  const stageBreakdown = document.getElementById("stage-breakdown");
  const stages = DATA.stage_breakdown || [];
  if (stages.length === 0) {
    stageBreakdown.innerHTML = '<div class="empty-state">No data yet</div>';
    return;
  }
  const max = Math.max(...stages.map(s => s.pct));
  stageBreakdown.innerHTML = stages.map(s => `
    <div class="stat-row">
      <span>${esc(s.stage)}</span>
      <span class="bar-bg"><span class="bar-fill" style="width:${(s.pct / max) * 100}%"></span></span>
      <span>${s.pct}%</span>
    </div>
  `).join("");
}

function renderTopLeads() {
  const topLeads = document.getElementById("top-leads");
  const leads = DATA.top_leads || [];
  if (leads.length === 0) {
    topLeads.innerHTML = '<div class="empty-state">No data yet</div>';
    return;
  }
  topLeads.innerHTML = leads.map(l => `
    <div class="stat-row">
      <span>${esc(l.investor)}</span>
      <span style="flex:1"></span>
      <span>${l.count}</span>
    </div>
  `).join("");
}

renderRounds();
renderStageBreakdown();
renderTopLeads();
document.getElementById("footer-note").textContent =
  (DATA.total_rounds_all_time || 0) + " rounds tracked all-time";
</script>
</body>
</html>
